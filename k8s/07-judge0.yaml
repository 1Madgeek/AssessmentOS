# Judge0 unit stack — Redis + API server + workers (AssessmentOS unit image).
# Requires privileged pods (isolate/cgroups). Set JUDGE0_IMAGE in deploy.env.
# API config: JUDGE0_URL=http://judge0-svc:2358  USE_MOCK_RUNNER=false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: judge0-config
  namespace: ${K8S_NAMESPACE}
data:
  judge0.conf: |
    REDIS_HOST=judge0-redis-svc
    REDIS_PORT=6379
    POSTGRES_ENABLE=false
    ENABLE_WAIT_RESULT=true
    ENABLE_CALLBACKS=false
    RAILS_ENV=production
    SECRET_KEY_BASE=assessmentos-judge0-change-me-in-prod-32chars-min
    INTERVAL=0.1
    COUNT=1
    MAX_CPU_TIME_LIMIT=15
    MAX_WALL_TIME_LIMIT=20
    MAX_MEMORY_LIMIT=512000
    MAX_PROCESSES_AND_THREADS=60
    MAX_FILE_SIZE=1024
    MAX_QUEUE_SIZE=100
    MAX_NUMBER_OF_RUNS=1
    ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
    ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
    MAX_EXTRACT_SIZE=10240
    ENABLE_BATCHED_SUBMISSIONS=true
    MAX_SUBMISSION_BATCH_SIZE=20
    ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
    ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
    ALLOW_ENABLE_NETWORK=false
    DISABLE_STDERR=false
    ENABLE_COMPILER_OPTIONS=true
    ALLOWED_LANGUAGES=
    NUMBER_OF_RUNNERS=2
    ENABLE_HOST_NETWORK=false
    ENABLE_SUDO=false
    ENABLE_CGROUP=true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge0-redis
  namespace: ${K8S_NAMESPACE}
  labels:
    app: judge0-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge0-redis
  template:
    metadata:
      labels:
        app: judge0-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: judge0-redis-svc
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: judge0-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge0
  namespace: ${K8S_NAMESPACE}
  labels:
    app: judge0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge0
  template:
    metadata:
      labels:
        app: judge0
    spec:
      imagePullSecrets:
        - name: ${IMAGE_PULL_SECRET}
      containers:
        - name: judge0
          image: ${JUDGE0_IMAGE}:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2358
          securityContext:
            privileged: true
          volumeMounts:
            - name: judge0-conf
              mountPath: /judge0.conf
              subPath: judge0.conf
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /about
              port: 2358
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /about
              port: 2358
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: judge0-conf
          configMap:
            name: judge0-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge0-workers
  namespace: ${K8S_NAMESPACE}
  labels:
    app: judge0-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge0-workers
  template:
    metadata:
      labels:
        app: judge0-workers
    spec:
      imagePullSecrets:
        - name: ${IMAGE_PULL_SECRET}
      containers:
        - name: workers
          image: ${JUDGE0_IMAGE}:latest
          imagePullPolicy: Always
          command: ["./scripts/workers"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: judge0-conf
              mountPath: /judge0.conf
              subPath: judge0.conf
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: judge0-conf
          configMap:
            name: judge0-config
---
apiVersion: v1
kind: Service
metadata:
  name: judge0-svc
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: judge0
  ports:
    - port: 2358
      targetPort: 2358
