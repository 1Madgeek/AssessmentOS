apiVersion: v1
kind: ConfigMap
metadata:
  name: assessmentos-config
  namespace: ${K8S_NAMESPACE}
data:
  WEB_ORIGIN: "https://${WEB_HOST}"
  CORS_ORIGIN: "https://${WEB_HOST}"
  API_HOST: "0.0.0.0"
  API_PORT: "4000"
  # Coding: mock runner on the API image (pytest/Jest/PHPUnit/JUnit/gtest baked in)
  USE_MOCK_RUNNER: "true"
  TRUST_PROXY: "true"
  STORAGE_DIR: "/app/data/assets"
  # Keep false on private company deploys — use make k8s-create-admin instead.
  ALLOW_PUBLIC_REGISTER: "false"
