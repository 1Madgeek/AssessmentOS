apiVersion: v1
kind: Secret
metadata:
  name: assessmentos-secret
  # Must match K8S_NAMESPACE in deploy.env (applied without envsubst)
  namespace: assessmentos
type: Opaque
stringData:
  # Min 32 chars — generate with: openssl rand -base64 32
  SESSION_SECRET: "CHANGE_ME"

  # Must match POSTGRES_PASSWORD below
  DATABASE_URL: "postgresql://assessment:CHANGE_ME@postgres-svc:5432/assessmentos"

  POSTGRES_PASSWORD: "CHANGE_ME"

  # Optional — invite OTP / notification email (Resend)
  # RESEND_API_KEY: "re_xxx"
  # EMAIL_FROM: "AssessmentOS <noreply@example.com>"

  # Optional — Turnstile (server secret; site key is a Docker build-arg)
  # TURNSTILE_SECRET_KEY: "0x..."

  # Optional — weekly pg_dump → S3-compatible object storage
  # DO_SPACES_BUCKET: "CHANGE_ME"
  # DO_SPACES_ACCESS_KEY_ID: "CHANGE_ME"
  # DO_SPACES_SECRET_ACCESS_KEY: "CHANGE_ME"
  # DO_SPACES_REGION: "blr1"
