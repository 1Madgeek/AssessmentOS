services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
      POSTGRES_DB: assessmentos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessmentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  judge0:
    image: judge0/judge0:1.13.0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docker/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true

  judge0-workers:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docker/judge0.conf:/judge0.conf:ro
    privileged: true

volumes:
  postgres_data:
